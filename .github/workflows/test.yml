name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db_test
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      TEST_BYPASS_AUTH: 'true'
      DATABASE_URL: postgresql://crm_user:crm_pass@localhost:5432/crm_db_test
      DATABASE_URL_TEST: postgresql://crm_user:crm_pass@localhost:5432/crm_db_test
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: it-school
      KEYCLOAK_CLIENT_ID: crm-backend
      KEYCLOAK_CLIENT_SECRET: test
      JWT_ISSUER: http://localhost:8080/realms/it-school
      JWT_AUDIENCE: account
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/it-school
      VITE_OIDC_CLIENT_ID: crm-frontend
      VITE_OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build-storybook

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  openapi-check:
    name: Check OpenAPI up-to-date
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db_test
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:crm_pass@localhost:5432/crm_db_test
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: it-school
      KEYCLOAK_CLIENT_ID: crm-backend
      KEYCLOAK_CLIENT_SECRET: test
      JWT_ISSUER: http://localhost:8080/realms/it-school
      JWT_AUDIENCE: account
      MINIO_ENDPOINT: localhost
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start backend
        run: |
          node dist/index.js &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "backend up"
              break
            fi
            sleep 1
          done
      - name: Fetch OpenAPI
        run: curl -fsS http://localhost:4000/api/openapi.json -o docs/openapi.json
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" || true
      - name: Check OpenAPI up-to-date
        run: |
          git diff --exit-code docs/openapi.json || \
            (echo "::error::OpenAPI spec изменился. Обнови docs/openapi.json" && exit 1)