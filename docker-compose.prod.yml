# docker-compose.prod.yml
name: it-school-crm-prod

services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crm-internal
    expose:
      - '5432'

  # ============================================================
  # Tempo (traces)
  # ============================================================
  tempo:
    image: grafana/tempo:2.6.0
    container_name: crm-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - crm-internal
    expose:
      - '3200'
      - '4318'

  # ============================================================
  # Redis (cache, rate limit, BullMQ)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - crm-internal
    expose:
      - '6379'

  # ============================================================
  # Keycloak
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crm-keycloak
    restart: unless-stopped
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --hostname=${KEYCLOAK_HOSTNAME}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_HEALTH_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded

      APP_HOSTNAME: ${APP_HOSTNAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /health/ready HTTP/1.1\nHost: localhost\n" >&3 && timeout 2 cat <&3 | grep -q "200 OK"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - crm-internal
    expose:
      - '8080'
      - '9000'

  # ============================================================
  # MinIO — файловое хранилище
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - crm-internal
    expose:
      - '9000'

  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/documents;
      mc anonymous set download local/documents;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - crm-internal

  # ============================================================
  # ClamAV — антивирус (ФСТЭК №117 п.19)
  # ============================================================
  clamav:
    image: clamav/clamav:stable
    container_name: crm-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: 'false'
      CLAMAV_NO_MILTERD: 'true'
      CLAMAV_NO_CLAMD: 'false'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3310 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - crm-internal
    # expose НЕ нужен: порт виден только внутри сети crm-internal

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crm-backend:${IMAGE_TAG:-latest}
    container_name: crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: https://${APP_HOSTNAME}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGINS: https://${APP_HOSTNAME}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: it-school
      KEYCLOAK_CLIENT_ID: crm-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET}
      JWT_ISSUER: https://${KEYCLOAK_HOSTNAME}/realms/it-school
      JWT_AUDIENCE: account
      SWAGGER_ENABLED: 'true'
      ENABLE_CRON: 'true'
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
      MINIO_PUBLIC_URL: https://${APP_HOSTNAME}/storage
      APP_URL: https://${APP_HOSTNAME}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      RATE_LIMIT_MAX: '200'
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-${KEYCLOAK_BACKEND_SECRET}}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      CLAMAV_ENABLED: 'true'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - crm-internal
    expose:
      - '4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================
  # Frontend (статика на nginx:alpine)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${APP_HOSTNAME}/api/v1
        VITE_OIDC_AUTHORITY: https://${KEYCLOAK_HOSTNAME}/realms/it-school
        VITE_OIDC_CLIENT_ID: crm-frontend
        VITE_OIDC_REDIRECT_URI: https://${APP_HOSTNAME}/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: https://${APP_HOSTNAME}
        VITE_OIDC_SCOPE: openid profile email roles
        VITE_MINIO_PUBLIC_URL: https://${APP_HOSTNAME}/storage
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    image: crm-frontend:${IMAGE_TAG:-latest}
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-internal
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # Nginx — reverse proxy + SSL
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - crm-internal

  # ============================================================
  # Certbot — автообновление SSL
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    restart: unless-stopped
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - crm-internal

  # ============================================================
  # Backup — ежедневный дамп PostgreSQL
  # ============================================================
  backup:
    image: postgres:16-alpine
    container_name: crm-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-internal

  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: crm-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - crm-internal
    expose:
      - '9090'

  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: crm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ''
      GF_SERVER_ROOT_URL: https://${APP_HOSTNAME}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - crm-internal
    expose:
      - '3000'

  # ============================================================
  # Loki — логи
  # ============================================================
  loki:
    image: grafana/loki:3.2.0
    container_name: crm-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - crm-internal
    expose:
      - '3100'

  # ============================================================
  # Promtail — сбор логов
  # ============================================================
  promtail:
    image: grafana/promtail:3.2.0
    container_name: crm-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - crm-internal

  # ============================================================
  # Postgres Exporter — метрики PostgreSQL
  # ============================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: crm-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'true'
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-internal
    expose:
      - '9187'

  # ============================================================
  # Redis Exporter — метрики Redis
  # ============================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: crm-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_KEYS: 'bull:*,cache:*'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crm-internal
    expose:
      - '9121'

  # ============================================================
  # Alertmanager
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: crm-alertmanager
    restart: unless-stopped
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - crm-internal
    expose:
      - '9093'

networks:
  crm-internal:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  minio_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  clamav_data: