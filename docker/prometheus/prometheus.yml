# docker/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'crm-prod'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ------------------------------------------------------------
  # Backend — prom-client метрики
  # ------------------------------------------------------------
  - job_name: 'crm-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:4000']

  # ------------------------------------------------------------
  # PostgreSQL — через postgres-exporter
  # ------------------------------------------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ------------------------------------------------------------
  # Redis — через redis-exporter
  # ------------------------------------------------------------
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ------------------------------------------------------------
  # Prometheus сам себя (для healthcheck)
  # ------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']