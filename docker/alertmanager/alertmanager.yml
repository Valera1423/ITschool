global:
  resolve_timeout: 5m
  telegram_api_url: 'https://api.telegram.org'

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-telegram'
      group_wait: 5s
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'warnings-telegram'
      repeat_interval: 6h

receivers:
  - name: 'default'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: 'HTML'

  - name: 'critical-telegram'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CRITICAL_CHAT_ID}
        parse_mode: 'HTML'
        message: |
          🚨 <b>КРИТИЧНО</b>
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}

  - name: 'warnings-telegram'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_WARNINGS_CHAT_ID}
        parse_mode: 'HTML'