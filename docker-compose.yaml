# docker-compose.yaml
name: it-school-crm

services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crm-internal

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - crm-internal

  # ============================================================
  # Keycloak
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crm-keycloak
    restart: unless-stopped
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --hostname=${KEYCLOAK_HOSTNAME}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crm_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-crm_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_HEALTH_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /health/ready HTTP/1.1\nHost: localhost\n" >&3 && timeout 2 cat <&3 | grep -q "200 OK"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - crm-internal

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - crm-internal

  minio-init:
    image: minio/mc:latest
    container_name: crm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/documents;
      mc anonymous set download local/documents;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - crm-internal

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crm-backend:latest
    container_name: crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: https://${APP_HOSTNAME}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm_db}?schema=public
      CORS_ORIGINS: https://${APP_HOSTNAME}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: it-school
      KEYCLOAK_CLIENT_ID: crm-backend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:?required}
      JWT_ISSUER: https://${KEYCLOAK_HOSTNAME}/realms/it-school
      JWT_AUDIENCE: account
      SWAGGER_ENABLED: 'true'
      ENABLE_CRON: 'true'
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-crm_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
      MINIO_PUBLIC_URL: https://${APP_HOSTNAME}/storage
      # Эти переменные принадлeжат backend'у (в prod-compose они были
      # ошибочно указаны у Keycloak).
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-${KEYCLOAK_BACKEND_SECRET}}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # busybox wget есть в alpine-образе node, curl — нет.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - crm-internal

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${APP_HOSTNAME}/api/v1
        VITE_OIDC_AUTHORITY: https://${KEYCLOAK_HOSTNAME}/realms/it-school
        VITE_OIDC_CLIENT_ID: crm-frontend
        VITE_OIDC_REDIRECT_URI: https://${APP_HOSTNAME}/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: https://${APP_HOSTNAME}
        VITE_OIDC_SCOPE: openid profile email roles
        VITE_MINIO_PUBLIC_URL: https://${APP_HOSTNAME}/storage
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    image: crm-frontend:latest
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - crm-internal

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - crm-internal

  # ============================================================
  # Certbot
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    restart: unless-stopped
    volumes:
      - ./docker/nginx/certs:/etc/letsencrypt
      - ./docker/nginx/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - crm-internal

  # ============================================================
  # Backup
  # ============================================================
  backup:
    image: postgres:16-alpine
    container_name: crm-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-crm_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm_db}
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-internal

networks:
  crm-internal:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  minio_data:
  nginx_logs: